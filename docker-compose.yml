services:
  minor_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: minor_backend:latest
    container_name: minor_backend
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - GROQ_FALLBACK_MODEL=${GROQ_FALLBACK_MODEL:-qwen/qwen3.8-27b}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/app/crawler/cache_storage:/app/app/crawler/cache_storage

  minor_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: minor_frontend:latest
    container_name: minor_frontend
    restart: always
    depends_on:
      - minor_backend
    ports:
      - "3000:80"
