services:
  minor_postgres:
    image: pgvector/pgvector:pg16
    container_name: minor_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: schemes_db
    ports:
      - "5432:5432"
    volumes:
      - minor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schemes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minor_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: minor_backend:latest
    container_name: minor_backend
    restart: always
    depends_on:
      minor_postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@minor_postgres:5432/schemes_db
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/data:/app/app/data

  minor_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: minor_frontend:latest
    container_name: minor_frontend
    restart: always
    depends_on:
      - minor_backend
    ports:
      - "3000:80"

volumes:
  minor_pgdata:
    name: minor_pgdata
